name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check scripts/setup.mjs
      - run: npm run build:plugin -- .local/plugins/naver-mail-mcp
      - name: Committed plugin bundle must match the source
        if: runner.os == 'Linux'
        run: git diff --exit-code --stat -- plugin/server/index.js
      - run: npm run test:plugin -- .local/plugins/naver-mail-mcp
      - run: node scripts/build-mcpb.mjs
      - run: npm pack --dry-run
